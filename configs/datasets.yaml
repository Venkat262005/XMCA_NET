        file: "data/raw/pope_coco_random.json"
        sha256: "ac25245170b975a5bdf9080b23fd431dfe6be458bc038259c1f4f09a6bef7994"
    source:
      repository: "https://github.com/RUCAIBox/POPE"
      data_file: "data/raw/pope_coco_adversarial.json"
      images_source: "MSCOCO 2014 val"
      expected_sha256: "420b3407db1fa9f1187a805dca41cb7b97fd91504e6c2179706188c107fb8ef8"
    required_fields:
      - "sample_id"
      - "image_id"
      - "image_path"
      - "question"
      - "ground_truth_label"
      - "category"

