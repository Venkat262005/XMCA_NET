    num_decoder_layers: 24
    hidden_dim: 1536
    vision_tower: "OpenGVLab/InternViT-300M-448px"
    halp_layer_indices:
      vf: "internvit_pooled"
      vt_1based: [1, 6, 12, 18, 24] # 5 VT positions: {1, L/4, L/2, 3L/4, L}
      vt_0based: [0, 5, 11, 17, 23] # Exact 0-based Python indices
      qt_1based: [1, 6, 12, 18, 24] # 5 QT positions: {1, L/4, L/2, 3L/4, L}
      qt_0based: [0, 5, 11, 17, 23] # Exact 0-based Python indices
    image_preprocessing:
