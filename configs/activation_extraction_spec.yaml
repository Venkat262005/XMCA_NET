      max_dynamic_patch: 12

halloc_taxonomy:
  official_categories:
    object: "Entity non-existence or hallucinated physical objects"
    attribute: "False colors, counts, materials, sizes, properties"
    relationship: "Erroneous spatial positions or interaction assertions"
    scene: "False background, environment, or location claims"
  custom_extensions:
    other: "Custom extension head: uncategorized factual errors or numbers (Non-official)"
  other: "Uncategorized factual errors, numbers, or ungrounded claims"

